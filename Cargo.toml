[workspace]
resolver = "2"
members = [
    "crates/heprint-core",
    "crates/heprint-render",
    "crates/heprint-print",
    "crates/heprint-server",
    "crates/heprint-cli",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["HePrint Team"]
license = "MIT"
repository = "https://github.com/yourname/heprint"
rust-version = "1.75"

[workspace.dependencies]
# 核心
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
once_cell = "1"

# 异步
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }

# Web 服务
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Windows API
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Storage_Xps",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
] }

# 渲染
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"

# 内部 crate
heprint-core = { path = "crates/heprint-core" }
heprint-render = { path = "crates/heprint-render" }
heprint-print = { path = "crates/heprint-print" }
heprint-server = { path = "crates/heprint-server" }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 1
